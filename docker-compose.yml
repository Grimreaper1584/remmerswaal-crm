# Pinning the compose project name keeps the data volume's real name stable
# (docker-compose namespaces volumes as "<project>_<volume>") even if this
# repository ever gets checked out into a differently-named directory.
name: remmerswaal-crm

services:
  crm:
    build: .
    container_name: remmerswaal-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      # Optional: pin a fixed JWT secret across container recreations.
      # If unset, a random secret is generated on first run and persisted
      # to the data volume (data/.jwt_secret).
      # - JWT_SECRET=change-this-to-a-long-random-string
      # Required to enable the internal API (/api/internal/*, used by the
      # GVM orchestrator). Without it, those routes return 500 rather than
      # being open. See docs/gvm-integration.md.
      # - INTERNAL_API_KEY=change-this-to-a-long-random-string
    volumes:
      - crm_data:/app/data

volumes:
  # Explicit fixed name so the volume is always addressed the same way
  # (docker volume ls / inspect / backup scripts) regardless of project name.
  crm_data:
    name: remmerswaal_crm_data
